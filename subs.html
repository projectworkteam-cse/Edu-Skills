<!DOCTYPE html>
<html lang="en">

<head>
<!-- EDU-SKILL AI: per-user Firebase data isolation + cloud sync -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/env.js"></script>
<script src="js/eduskill-sync.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-SKILL'S AI - Subjects &amp; Exams</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --bg-light: #f4f6f9;
            --card-bg: #ffffff;
            --card-border: #edf2f7;
            --primary-blue: #4f46e5;
            --primary-purple: #6366f1;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --red-bg: #fef2f2;
            --red-text: #ef4444;
            --green-bg: #f0fdf4;
            --green-text: #16a34a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .page-body {
            display: flex;
            gap: 24px;
            padding: 24px 32px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .left-content {
            flex: 1;
            min-width: 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"],
        input[type="date"],
        select {
            height: 40px;
            padding: 8px 12px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 13px;
            background: #ffffff;
            color: var(--text-main);
            outline: none;
            flex: 1;
            min-width: 160px;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            border-color: var(--primary-blue);
        }

        button.btn-primary {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        button.btn-primary:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button.btn-primary:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-delete {
            background: var(--red-bg);
            color: var(--red-text);
            border: 1px solid #fee2e2;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .btn-delete:hover {
            background: #fee2e2;
        }

        .status-msg {
            font-size: 12px;
            margin-top: 8px;
            min-height: 18px;
            transition: color 0.3s;
        }

        .status-msg.error { color: var(--red-text); }
        .status-msg.success { color: var(--green-text); }
        .status-msg.info { color: var(--text-sub); }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .topic-panel {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--card-border);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .topic-list {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            margin: 12px 0;
        }

        .topic-option {
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--bg-light);
            border: 1px solid var(--card-border);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .topic-option:hover {
            border-color: var(--primary-blue);
            background: #eef2ff;
        }

        .topic-option input[type="checkbox"] {
            width: 14px;
            height: 14px;
            min-width: unset;
            flex: none;
            cursor: pointer;
            accent-color: var(--primary-blue);
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin: 20px 0 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .subject-card,
        .exam-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: box-shadow 0.2s;
        }

        .subject-card:hover,
        .exam-card:hover {
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
        }

        .topic-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .difficulty-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 4px;
        }

        .difficulty-badge.Easy { background: #f0fdf4; color: #16a34a; }
        .difficulty-badge.Medium { background: #fffbeb; color: #d97706; }
        .difficulty-badge.Hard { background: var(--red-bg); color: var(--red-text); }

        .empty-msg {
            font-size: 13px;
            color: var(--text-sub);
            text-align: center;
            padding: 20px 0;
        }

        .dashboard-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
            align-items: start;
        }

        .dashboard-card {
            flex: 1;
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .dashboard-card .section-title {
            margin-bottom: 18px;
            text-align: center;
        }

        .topic-item.done {
            text-decoration: line-through;
            opacity: 0.65;
            background: #f1f5f9 !important;
        }

        /* ── RESPONSIVE: adapts to all screen sizes ─────────────────────────── */
        @media (max-width: 1024px) {
            .page-body {
                padding: 18px 20px;
                gap: 18px;
            }
        }

        @media (max-width: 768px) {
            .page-body {
                gap: 14px;
            }

            .form-row {
                gap: 8px;
            }
        }

        @media (max-width: 640px) {
            .page-body {
                flex-direction: column;
                padding: 16px;
                gap: 16px;
            }

            .dashboard-row {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        @media (max-width: 480px) {
            .page-body {
                padding: 10px;
                gap: 12px;
            }

            .card {
                padding: 14px;
                border-radius: 10px;
                margin-bottom: 14px;
            }

            .dashboard-card {
                padding: 14px;
            }

            .form-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .form-row input,
            .form-row select,
            .form-row button.btn-primary {
                min-width: 0;
                width: 100%;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .card-header {
                flex-wrap: wrap;
                gap: 8px;
            }

            .section-title {
                font-size: 15px;
                margin: 16px 0 10px;
            }
        }

        @media (max-width: 340px) {
            .page-body {
                padding: 8px;
            }

            .card {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="main-wrapper">
        <div class="page-body">
            <div class="left-content">

                <section class="card">
                    <div class="card-header">
                        <div class="card-title-group">
                            <i class="fas fa-plus-circle" style="color: var(--primary-blue);"></i>
                            <span>Add New Subject</span>
                        </div>
                    </div>

                    <div class="form-row">
                        <input type="text" id="subjectName" placeholder="Subject name (e.g. Mathematics)">
                        <select id="difficulty">
                            <option value="">Difficulty level</option>
                            <option value="Easy">Easy</option>
                            <option value="Medium">Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                        <button id="generateBtn" class="btn-primary" type="button" onclick="generateTopics()">
                            <i class="fas fa-robot"></i> Generate AI Topics
                        </button>
                    </div>

                    <p id="topicStatus" class="status-msg info"></p>

                    <div id="topicPanel" class="topic-panel">
                        <h4 style="font-size: 13px; color: var(--primary-purple);">Select topics to study:</h4>
                        <div id="topicList" class="topic-list"></div>
                        <button class="btn-primary" type="button" onclick="addSubject()">
                            <i class="fas fa-check"></i> Add Subject
                        </button>
                        <p id="addSubjectStatus" class="status-msg"></p>
                    </div>
                </section>

                <section class="card">
                    <div class="card-header">
                        <div class="card-title-group">
                            <i class="fas fa-calendar-check" style="color: var(--primary-purple);"></i>
                            <span>Add Exam Details</span>
                        </div>
                        <span style="font-size: 11px; color: var(--text-sub); background: var(--bg-light); padding: 2px 8px; border-radius: 10px;">Optional</span>
                    </div>

                    <div class="form-row">
                        <input type="text" id="examName" placeholder="Exam name (e.g. Midterm)">
                        <select id="examSubjectSelect">
                            <option value="">Select Subject</option>
                        </select>
                        <input type="date" id="examDate">
                        <button class="btn-primary" type="button" onclick="addExam()">
                            <i class="fas fa-save"></i> Save Exam
                        </button>
                    </div>

                    <p id="examStatus" class="status-msg"></p>
                </section>

                <div class="dashboard-row">

                    <div class="dashboard-card">
                        <h2 class="section-title">📚 Your Subjects</h2>
                        <p style="font-size:11.5px;color:var(--text-sub);text-align:center;margin:-10px 0 14px;">
                            <i class="fas fa-circle-info"></i> Topics are completed by passing their quiz in the Quiz tab.
                        </p>
                        <section class="grid" id="subjects"></section>
                    </div>

                    <div class="dashboard-card">
                        <h2 class="section-title">📝 Upcoming Exams</h2>
                        <section class="grid" id="exams"></section>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        let subjects = JSON.parse(localStorage.getItem('subjects') || '[]');
        let exams = JSON.parse(localStorage.getItem('exams') || '[]');
        let generatedTopics = [];

        const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));

        function setStatus(id, text, type = 'info') {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = text;
            el.className = `status-msg ${type}`;
        }

        function clearStatus(id) { setStatus(id, '', 'info'); }

        function updateSubjectSelect() {
            const select = document.getElementById('examSubjectSelect');
            if (!select) return;
            select.innerHTML = subjects.length
                ? '<option value="">Select Subject</option>' +
                subjects.map(s => `<option value="${escapeHTML(s.name)}">${escapeHTML(s.name)}</option>`).join('')
                : '<option value="">No subjects available</option>';
        }

        async function generateTopics() {
            const subject = document.getElementById('subjectName').value.trim();
            const difficulty = document.getElementById('difficulty').value;
            const button = document.getElementById('generateBtn');

            if (!subject) {
                setStatus('topicStatus', 'Please enter a subject name first.', 'error');
                return;
            }

            if (!difficulty) {
                setStatus('topicStatus', 'Please select a difficulty level first.', 'error');
                return;
            }

            button.disabled = true;
            button.textContent = 'Generating...';

            setStatus('topicStatus', `🤖 AI is generating topics for "${subject}"...`, 'info');
            document.getElementById('topicPanel').style.display = 'none';

            const prompt = `You are an expert study planner.
Generate exactly 8 study topics for the subject "${subject}".
Difficulty: ${difficulty}
For every topic estimate the required study time.
Return ONLY valid JSON.
Example:
[{"topic":"Introduction","minutes":30},{"topic":"Loops","minutes":60}]
Rules:
Easy -> 20 to 45 mins
Medium -> 45 to 90 mins
Hard -> 90 to 180 mins
Only JSON.`;

            try {
                const data = await window.eduskillGroqFetch({
                    model: "openai/gpt-oss-120b",
                    messages: [
                        { role: "system", content: "Return only JSON." },
                        { role: "user", content: prompt }
                    ],
                    temperature: 0.7,
                    max_tokens: 600
                });

                const raw = data.choices?.[0]?.message?.content || "";
                const json = raw.match(/\[[\s\S]*\]/);

                if (!json) throw new Error("Invalid AI response format");

                const parsed = JSON.parse(json[0]);
                if (!Array.isArray(parsed) || parsed.length === 0) {
                    throw new Error("AI did not return any topics. Please try again.");
                }

                generatedTopics = parsed.map(item => {
                    const topicStr = (item && typeof item.topic === 'string') ? item.topic.trim() : '';
                    const rawMins = Number(item && item.minutes);
                    const validMins = (Number.isFinite(rawMins) && rawMins > 0) ? Math.min(Math.max(Math.round(rawMins), 5), 240) : 30;
                    return {
                        topic: topicStr || 'Untitled Topic',
                        minutes: validMins
                    };
                }).filter(t => t.topic.length > 0);

                if (generatedTopics.length === 0) {
                    throw new Error("No valid topics found in AI response.");
                }

                document.getElementById("topicList").innerHTML =
                    generatedTopics.map((item, index) => `
                        <label class="topic-option">
                            <input type="checkbox" checked data-topic="${index}">
                            <div>
                                <b>${escapeHTML(item.topic)}</b><br>
                                <small>⏱ ${escapeHTML(String(item.minutes))} mins</small>
                            </div>
                        </label>
                    `).join("");

                document.getElementById("topicPanel").style.display = "block";
                clearStatus("topicStatus");
                clearStatus("addSubjectStatus");

            } catch (err) {
                console.error(err);
                setStatus("topicStatus", err.message, "error");
            } finally {
                button.disabled = false;
                button.textContent = 'Generate AI Topics';
            }
        }

        function addSubject() {
            const name = document.getElementById("subjectName").value.trim();
            const difficulty = document.getElementById("difficulty").value;

            const selected = [...document.querySelectorAll("#topicList input:checked")]
                .map(input => generatedTopics[Number(input.dataset.topic)])
                .filter(Boolean);

            if (!name || !difficulty) {
                setStatus("addSubjectStatus", "Subject name and difficulty are required.", "error");
                return;
            }

            if (!selected.length) {
                setStatus("addSubjectStatus", "Please select at least one topic.", "error");
                return;
            }

            const totalMinutes = selected.reduce((sum, item) => sum + Number(item.minutes), 0);

            const newSubject = {
                id: Date.now(),
                name,
                difficulty,
                topics: selected,
                totalMinutes
            };

            subjects.push(newSubject);
            localStorage.setItem("subjects", JSON.stringify(subjects));

            document.getElementById("subjectName").value = "";
            document.getElementById("difficulty").value = "";
            document.getElementById("topicPanel").style.display = "none";
            document.getElementById("topicList").textContent = "";
            generatedTopics = [];

            updateSubjectSelect();
            renderSubjects();

            setStatus("topicStatus", `✅ Subject "${name}" added successfully!`, "success");
            setTimeout(() => clearStatus("topicStatus"), 3000);
        }

        function addExam() {
            const name = document.getElementById('examName').value.trim();
            const subject = document.getElementById('examSubjectSelect').value;
            const date = document.getElementById('examDate').value;

            if (!name) { setStatus('examStatus', 'Please enter an exam name.', 'error'); return; }
            if (!subject) { setStatus('examStatus', 'Please select a subject.', 'error'); return; }
            if (!date) { setStatus('examStatus', 'Please pick an exam date.', 'error'); return; }

            const examTime = new Date(date + 'T00:00:00');
            if (isNaN(examTime.getTime())) {
                setStatus('examStatus', 'Please pick a valid calendar date.', 'error');
                return;
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const isPast = examTime < today;
            if (isPast) {
                if (!confirm(`The date "${date}" is in the past. Do you want to save this as a past exam record?`)) {
                    return;
                }
            }

            const newExam = { id: Date.now(), name, subject, date, historical: isPast };
            exams.push(newExam);
            localStorage.setItem('exams', JSON.stringify(exams));

            document.getElementById('examName').value = '';
            document.getElementById('examSubjectSelect').value = '';
            document.getElementById('examDate').value = '';

            renderExams();
            setStatus('examStatus', `✅ Exam "${name}" saved for ${date}!`, 'success');
            setTimeout(() => clearStatus('examStatus'), 3500);

            if (window.parent && typeof window.parent.renderUpcomingExams === 'function') {
                window.parent.renderUpcomingExams();
                if (typeof window.parent.updateNotificationBadge === 'function') {
                    window.parent.updateNotificationBadge();
                }
            }
        }

        function toggleTopicDone(subjectId, topicIdx) {
            const sub = subjects.find(s => Number(s.id) === Number(subjectId));
            if (!sub || !sub.topics || !sub.topics[topicIdx]) return;

            const targetTopic = sub.topics[topicIdx];
            targetTopic.done = !targetTopic.done;

            localStorage.setItem('subjects', JSON.stringify(subjects));

            const d = new Date();
            const todayKey = 'tasks_' + d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');

            const todayTasks = JSON.parse(localStorage.getItem(todayKey) || '[]');
            let updatedTasks = false;

            function stripPrefix(text) {
                return text
                    .replace(/^(read|review|watch|study|write|implement|complete|create|practice|learn|finish|do|solve)\b[\s\S]*?(for|on|about|of|in|to)\b\s*/i, '')
                    .replace(/\(\d+\s*mins?\)\s*$/i, '')
                    .trim();
            }

            function matches(taskText, topicName) {
                if (!taskText || !topicName) return false;
                const tNorm = String(taskText).trim().toLowerCase();
                const pNorm = String(topicName).trim().toLowerCase();
                if (tNorm === pNorm) return true;
                const escaped = pNorm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp('(?:^|\\b|\\s)' + escaped + '(?:$|\\b|\\s)', 'i');
                if (regex.test(tNorm)) return true;
                const stripped = stripPrefix(taskText).toLowerCase();
                return regex.test(stripped);
            }

            todayTasks.forEach(task => {
                if (matches(task.text, targetTopic.topic)) {
                    const wasDone = task.done;
                    task.done = targetTopic.done;
                    updatedTasks = true;
                    if (task.done && !wasDone) {
                        bumpCompletedTotal(1);
                    } else if (!task.done && wasDone) {
                        bumpCompletedTotal(-1);
                    }
                }
            });

            if (updatedTasks) {
                localStorage.setItem(todayKey, JSON.stringify(todayTasks));
            }

            renderSubjects();
            refreshProgressViews();
        }

        // Keep the lifetime completed-task counter in step with task toggles
        function bumpCompletedTotal(delta) {
            const current = parseInt(localStorage.getItem('tasksCompletedTotal') || '0', 10) || 0;
            localStorage.setItem('tasksCompletedTotal', String(Math.max(0, current + delta)));
        }

        // Ask the shell (and whichever page is loaded in it) to re-read progress data
        function refreshProgressViews() {
            if (window.parent && typeof window.parent.renderTasks === 'function') {
                window.parent.renderTasks();
                if (typeof window.parent.updateNotificationBadge === 'function') {
                    window.parent.updateNotificationBadge();
                }
            }

            let iframe = null;
            try {
                iframe = window.parent.document.getElementById('pageViewport');
            } catch (e) {
                iframe = null;
            }
            if (!iframe || !iframe.contentWindow) return;

            const view = iframe.contentWindow;
            ['renderSubjects', 'loadSubjectProgress', 'loadMetrics', 'loadBadges', 'loadInsight', 'renderChart'].forEach(fn => {
                if (typeof view[fn] === 'function') view[fn]();
            });
        }

        function renderSubjects() {
            subjects = JSON.parse(localStorage.getItem('subjects') || '[]');
            const box = document.getElementById("subjects");

            if (!subjects.length) {
                box.innerHTML = '<p class="empty-msg">No subjects added yet. Use the form above to get started!</p>';
                return;
            }

            box.innerHTML = subjects.map(subject => {
                const total = subject.totalMinutes || 0;
                const hrs = Math.floor(total / 60);
                const mins = total % 60;
                const totalText = hrs > 0 ? `${hrs} hr ${mins} mins` : `${mins} mins`;

                const topics = Array.isArray(subject.topics) ? subject.topics : [];
                const doneTopics = topics.filter(t => t && t.done).length;
                const pct = topics.length > 0 ? Math.round((doneTopics / topics.length) * 100) : 0;

                return `
                <article class="subject-card">
                    <div>
                        <h3 style="font-size:16px;">📚 ${escapeHTML(subject.name)}</h3>
                        <span class="difficulty-badge ${escapeHTML(subject.difficulty || 'Medium')}">${escapeHTML(subject.difficulty || 'Medium')}</span>

                        <p style="margin-top:10px; font-weight:bold; color:#4f46e5;">
                            ⏱ Total Study Time : ${totalText}
                        </p>

                        <div style="margin-top:10px;">
                            <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-sub); margin-bottom:4px;">
                                <span>Progress</span>
                                <span>${doneTopics}/${topics.length} topics · ${pct}%</span>
                            </div>
                            <div style="height:8px; background:#f1f5f9; border-radius:10px; overflow:hidden;">
                                <div style="height:100%; width:${pct}%; background:#4f46e5; border-radius:10px; transition:width 0.4s ease;"></div>
                            </div>
                        </div>

                        <div class="topic-tags">
                            ${(subject.topics || []).map((item, idx) => `
                                <div class="topic-item ${item.done ? 'done' : ''}" style="
                                    width:100%;
                                    padding:8px;
                                    margin-top:6px;
                                    background:#eef2ff;
                                    border-radius:8px;
                                    font-size:12px;
                                    display:flex;
                                    align-items:center;
                                    gap:8px;
                                ">
                                    <input 
                                        type="checkbox" 
                                        ${item.done ? 'checked' : ''} 
                                        disabled
                                        title="Complete this topic by passing its quiz in the Quiz tab"
                                        style="cursor:not-allowed; width:15px; height:15px; accent-color:#4f46e5;"
                                    >
                                    <div style="flex:1;">
                                        <b style="${item.done ? 'text-decoration: line-through; color: var(--text-sub);' : ''}">${escapeHTML(item.topic)}</b>
                                        <br>
                                        <small style="color:var(--text-sub);">⏱ ${escapeHTML(String(Number(item.minutes) || 30))} mins</small>
                                    </div>
                                </div>
                            `).join("")}
                        </div>
                    </div>

                    <button class="btn-delete" onclick="deleteSubject(${subject.id})">
                        <i class="fas fa-trash-alt"></i> Delete
                    </button>
                </article>
                `;
            }).join("");
        }

        function renderExams() {
            exams = JSON.parse(localStorage.getItem('exams') || '[]');
            const box = document.getElementById('exams');

            if (!exams.length) {
                box.innerHTML = '<p class="empty-msg">No upcoming exams. Add exam details above!</p>';
                return;
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            box.innerHTML = exams.map(e => {
                const examTime = new Date(e.date + 'T00:00:00');
                const isPast = e.historical || (!isNaN(examTime.getTime()) && examTime < today);
                return `
                <article class="exam-card">
                    <div>
                        <h3 style="font-size: 15px; font-weight: 600;">📝 ${escapeHTML(e.name)}${isPast ? ' <span style="font-size:10px;padding:2px 6px;background:#f1f5f9;color:var(--text-sub);border-radius:4px;font-weight:normal;">Past</span>' : ''}</h3>
                        <p style="font-size: 12px; color: var(--primary-blue); font-weight: 600; margin-top: 4px;">
                            ${escapeHTML(e.subject)}
                        </p>
                        <p style="font-size: 12px; color: var(--text-sub); margin-top: 6px;">
                            📅 ${escapeHTML(e.date)}
                        </p>
                    </div>

                    <button class="btn-delete" onclick="deleteExam(${Number(e.id)})">
                        <i class="fas fa-trash-alt"></i> Delete
                    </button>
                </article>
            `;}).join('');
        }

        // ── DELETE SUBJECT + ITS RELATED TASKS ──────────────────────────────
        // Removes any daily tasks (tasks_*) whose text matches this subject's
        // name or topic names, so stale tasks don't linger after deletion.
        function stripTaskPrefix(text) {
            return text
                .replace(/^(read|review|watch|study|write|implement|complete|create|practice|learn|finish|do|solve)\b[\s\S]*?(for|on|about|of|in|to)\b\s*/i, '')
                .replace(/\(\d+\s*mins?\)\s*$/i, '')
                .trim();
        }

        function topicMatchesTask(taskText, topicName) {
            if (!taskText || !topicName) return false;
            const tNorm = String(taskText).trim().toLowerCase();
            const pNorm = String(topicName).trim().toLowerCase();
            if (tNorm === pNorm) return true;
            const escaped = pNorm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp('(?:^|\\b|\\s)' + escaped + '(?:$|\\b|\\s)', 'i');
            if (regex.test(tNorm)) return true;
            const stripped = stripTaskPrefix(taskText).toLowerCase();
            return regex.test(stripped);
        }

        function removeRelatedTasks(subject) {
            const matchTerms = (subject.topics || []).map(t => t.topic);
            if (subject.name) matchTerms.push(subject.name);
            const terms = matchTerms.filter(Boolean);
            if (!terms.length) return;

            const today = new Date();
            for (let offset = -30; offset <= 60; offset++) {
                const d = new Date(today);
                d.setDate(today.getDate() + offset);
                const key = 'tasks_' + d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
                const raw = localStorage.getItem(key);
                if (!raw) continue;
                let tasks;
                try { tasks = JSON.parse(raw); } catch (e) { continue; }
                if (!Array.isArray(tasks) || !tasks.length) continue;
                const filtered = tasks.filter(task => {
                    return task.done || !terms.some(term => topicMatchesTask(task.text, term));
                });
                if (filtered.length !== tasks.length) {
                    localStorage.setItem(key, JSON.stringify(filtered));
                }
            }
        }

        function deleteSubject(id) {
            const subject = subjects.find(s => Number(s.id) === id);
            if (!subject) return;
            if (!confirm(`Are you sure you want to delete "${subject.name}" and clean up its pending tasks?`)) return;

            subjects = subjects.filter(s => Number(s.id) !== id);
            localStorage.setItem('subjects', JSON.stringify(subjects));

            removeRelatedTasks(subject);

            updateSubjectSelect();
            renderSubjects();

            function notifyParent() {
                if (window.parent && window.parent !== window) {
                    if (typeof window.parent.renderTasks === 'function') {
                        window.parent.renderTasks();
                    }
                    if (typeof window.parent.updateNotificationBadge === 'function') {
                        window.parent.updateNotificationBadge();
                    }
                    try { window.parent.postMessage({ type: 'data-changed' }, window.location.origin); } catch (e) {}
                }
            }
            notifyParent();
            setTimeout(notifyParent, 100);
        }

        function deleteExam(id) {
            const exam = exams.find(e => Number(e.id) === id);
            if (exam && !confirm(`Are you sure you want to delete exam "${exam.name}"?`)) return;

            exams = exams.filter(e => Number(e.id) !== id);
            localStorage.setItem('exams', JSON.stringify(exams));
            renderExams();

            if (window.parent && typeof window.parent.renderUpcomingExams === 'function') {
                window.parent.renderUpcomingExams();
                if (typeof window.parent.updateNotificationBadge === 'function') {
                    window.parent.updateNotificationBadge();
                }
            }
        }

        // Normalize subjects without dropping records (FUNC-09)
        let _subjectsModified = false;
        subjects.forEach((s, idx) => {
            if (!Array.isArray(s.topics)) { s.topics = []; _subjectsModified = true; }
            if (!s.id) { s.id = Date.now() + idx; _subjectsModified = true; }
        });
        if (_subjectsModified) {
            localStorage.setItem('subjects', JSON.stringify(subjects));
        }

        // Initialize page elements on load
        updateSubjectSelect();
        renderSubjects();
        renderExams();
    </script>
    <script>
        document.addEventListener('click', () => {
            if (window.parent && typeof window.parent.closeOverlays === 'function') {
                window.parent.closeOverlays();
            }
        });
    </script>
</body>

</html>
