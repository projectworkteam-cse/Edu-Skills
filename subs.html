<!DOCTYPE html>
<html lang="en">

<head>
<!-- EDU-SKILL AI: per-user Firebase data isolation + cloud sync -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/services/sync-shards.js"></script>
<script src="js/domain/migrate.js"></script>
<script src="js/services/storage.js"></script>
<script src="js/services/ai-client.js"></script>
<script src="js/lib/ui.js"></script>
<script src="js/env.js"></script>
<script src="js/eduskill-sync.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-SKILL'S AI - Subjects &amp; Exams</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --bg-light: #f4f6f9;
            --card-bg: #ffffff;
            --card-border: #edf2f7;
            --primary-blue: #4f46e5;
            --primary-purple: #6366f1;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --red-bg: #fef2f2;
            --red-text: #ef4444;
            --green-bg: #f0fdf4;
            --green-text: #16a34a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .page-body {
            display: flex;
            gap: 24px;
            padding: 24px 32px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .left-content {
            flex: 1;
            min-width: 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"],
        input[type="date"],
        select {
            height: 40px;
            padding: 8px 12px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 13px;
            background: #ffffff;
            color: var(--text-main);
            outline: none;
            flex: 1;
            min-width: 160px;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            border-color: var(--primary-blue);
        }

        button.btn-primary {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        button.btn-primary:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button.btn-primary:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-delete {
            background: var(--red-bg);
            color: var(--red-text);
            border: 1px solid #fee2e2;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .btn-delete:hover {
            background: #fee2e2;
        }

        .btn-edit {
            background: #eef2ff;
            color: #4f46e5;
            border: 1px solid #c7d2fe;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-edit:hover {
            background: #e0e7ff;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            align-items: center;
        }

        .status-msg {
            font-size: 12px;
            margin-top: 8px;
            min-height: 18px;
            transition: color 0.3s;
        }

        .status-msg.error { color: var(--red-text); }
        .status-msg.success { color: var(--green-text); }
        .status-msg.info { color: var(--text-sub); }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .topic-panel {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--card-border);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .topic-list {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            margin: 12px 0;
        }

        .topic-option {
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--bg-light);
            border: 1px solid var(--card-border);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .topic-option:hover {
            border-color: var(--primary-blue);
            background: #eef2ff;
        }

        .topic-option input[type="checkbox"] {
            width: 14px;
            height: 14px;
            min-width: unset;
            flex: none;
            cursor: pointer;
            accent-color: var(--primary-blue);
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin: 20px 0 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .subject-card,
        .exam-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: box-shadow 0.2s;
        }

        .subject-card:hover,
        .exam-card:hover {
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
        }

        .topic-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .difficulty-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 4px;
        }

        .difficulty-badge.Easy { background: #f0fdf4; color: #16a34a; }
        .difficulty-badge.Medium { background: #fffbeb; color: #d97706; }
        .difficulty-badge.Hard { background: var(--red-bg); color: var(--red-text); }

        .empty-msg {
            font-size: 13px;
            color: var(--text-sub);
            text-align: center;
            padding: 20px 0;
        }

        .dashboard-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
            align-items: start;
        }

        .dashboard-card {
            flex: 1;
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .dashboard-card .section-title {
            margin-bottom: 18px;
            text-align: center;
        }

        .topic-item.done {
            text-decoration: line-through;
            opacity: 0.65;
            background: #f1f5f9 !important;
        }

        /* ── RESPONSIVE: adapts to all screen sizes ─────────────────────────── */
        @media (max-width: 1024px) {
            .page-body {
                padding: 18px 20px;
                gap: 18px;
            }
        }

        @media (max-width: 768px) {
            .page-body {
                gap: 14px;
            }

            .form-row {
                gap: 8px;
            }
        }

        @media (max-width: 640px) {
            .page-body {
                flex-direction: column;
                padding: 16px;
                gap: 16px;
            }

            .dashboard-row {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        @media (max-width: 480px) {
            .page-body {
                padding: 10px;
                gap: 12px;
            }

            .card {
                padding: 14px;
                border-radius: 10px;
                margin-bottom: 14px;
            }

            .dashboard-card {
                padding: 14px;
            }

            .form-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .form-row input,
            .form-row select,
            .form-row button.btn-primary {
                min-width: 0;
                width: 100%;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .card-header {
                flex-wrap: wrap;
                gap: 8px;
            }

            .section-title {
                font-size: 15px;
                margin: 16px 0 10px;
            }
        }

        @media (max-width: 340px) {
            .page-body {
                padding: 8px;
            }

            .card {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="main-wrapper">
        <div class="page-body">
            <div class="left-content">

                <section class="card">
                    <div class="card-header">
                        <div class="card-title-group">
                            <i class="fas fa-plus-circle" style="color: var(--primary-blue);"></i>
                            <span>Add New Subject</span>
                        </div>
                    </div>

                    <div class="form-row">
                        <input type="text" id="subjectName" placeholder="Subject name (e.g. Mathematics)">
                        <select id="difficulty">
                            <option value="">Difficulty level</option>
                            <option value="Easy">Easy</option>
                            <option value="Medium">Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                        <button id="generateBtn" class="btn-primary" type="button" onclick="generateTopics()">
                            <i class="fas fa-robot"></i> Generate AI Topics
                        </button>
                    </div>

                    <p id="topicStatus" class="status-msg info"></p>

                    <div id="topicPanel" class="topic-panel">
                        <h4 style="font-size: 13px; color: var(--primary-purple);">Select topics to study:</h4>
                        <div id="topicList" class="topic-list"></div>
                        <button class="btn-primary" type="button" onclick="addSubject()">
                            <i class="fas fa-check"></i> Add Subject
                        </button>
                        <p id="addSubjectStatus" class="status-msg"></p>
                    </div>
                </section>

                <section class="card">
                    <div class="card-header">
                        <div class="card-title-group">
                            <i class="fas fa-calendar-check" style="color: var(--primary-purple);"></i>
                            <span>Add Exam Details</span>
                        </div>
                        <span style="font-size: 11px; color: var(--text-sub); background: var(--bg-light); padding: 2px 8px; border-radius: 10px;">Optional</span>
                    </div>

                    <div class="form-row">
                        <input type="text" id="examName" placeholder="Exam name (e.g. Midterm)">

                        </select>
                        <input type="date" id="examDate">

                    </div>

                    <p id="examStatus" class="status-msg"></p>
                </section>

                <div class="dashboard-row">

                    <div class="dashboard-card">
                        <h2 class="section-title">📚 Your Subjects</h2>
                        <p style="font-size:11.5px;color:var(--text-sub);text-align:center;margin:-10px 0 14px;">
                            <i class="fas fa-circle-info"></i> Topics are completed by passing their quiz in the Quiz tab.
                        </p>
                        <section class="grid" id="subjects"></section>
                    </div>

                    <div class="dashboard-card">
                        <h2 class="section-title">📝 Upcoming Exams</h2>
                        <section class="grid" id="exams"></section>

                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal (V1-FUNC-06) -->
    <div id="editModalOverlay" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.5); z-index:9999; align-items:center; justify-content:center; padding:16px;">
        <div style="background:#ffffff; border-radius:12px; max-width:440px; width:100%; padding:20px; box-shadow:0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); border:1px solid var(--card-border);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                <h3 id="editModalTitle" style="font-size:16px; font-weight:700; color:var(--text-main); margin:0;">Edit</h3>
                <button type="button" onclick="closeEditModal()" style="border:none; background:none; font-size:20px; color:var(--text-sub); cursor:pointer; padding:4px;">&times;</button>
            </div>
            <div id="editModalFields" style="display:flex; flex-direction:column; gap:12px;"></div>
            <p id="editModalError" class="status-msg error" style="margin-top:8px; display:none;"></p>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:18px;">
                <button type="button" onclick="closeEditModal()" style="padding:8px 14px; border-radius:8px; border:1px solid var(--card-border); background:var(--bg-light); color:var(--text-main); font-weight:600; font-size:13px; cursor:pointer;">Cancel</button>
                <button type="button" id="editModalSaveBtn" class="btn-primary" style="padding:8px 16px; font-size:13px;">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        let generatedTopics = [];

        function getSubjects() {
            return (window.EduStorage && typeof window.EduStorage.readJSON === 'function')
                ? window.EduStorage.readJSON('subjects', [])
                : [];
        }

        function saveSubjects(list) {
            if (window.EduStorage && typeof window.EduStorage.writeJSON === 'function') {
                window.EduStorage.writeJSON('subjects', list);
            } else {
                localStorage.setItem('subjects', JSON.stringify(list));
            }
        }

        function getExams() {
            return (window.EduStorage && typeof window.EduStorage.readJSON === 'function')
                ? window.EduStorage.readJSON('exams', [])
                : [];
        }

        function saveExams(list) {
            if (window.EduStorage && typeof window.EduStorage.writeJSON === 'function') {
                window.EduStorage.writeJSON('exams', list);
            } else {
                localStorage.setItem('exams', JSON.stringify(list));
            }
        }

        const escapeHTML = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));

        function setStatus(id, text, type = 'info') {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = text;
            el.className = `status-msg ${type}`;
        }

        function clearStatus(id) { setStatus(id, '', 'info'); }

        function updateSubjectSelect() {
            const select = document.getElementById('examSubjectSelect');
            if (!select) return;
            const subjects = getSubjects();
            select.innerHTML = subjects.length
                ? '<option value="">Select Subject</option>' +
                subjects.map(s => `<option value="${escapeHTML(s.name)}">${escapeHTML(s.name)}</option>`).join('')
                : '<option value="">No subjects available</option>';
        }

        async function generateTopics() {
            const subject = document.getElementById('subjectName').value.trim();
            const difficulty = document.getElementById('difficulty').value;
            const button = document.getElementById('generateBtn');

            if (!subject) {
                setStatus('topicStatus', 'Please enter a subject name first.', 'error');
                return;
            }
            if (subject.length > 40) {
                setStatus('topicStatus', 'Subject name must be at most 40 characters.', 'error');
                return;
            }
            if (!difficulty) {
                setStatus('topicStatus', 'Please select a difficulty level first.', 'error');
                return;
            }

            button.disabled = true;
            button.textContent = 'Generating...';

            setStatus('topicStatus', `🤖 AI is generating topics for "${subject}"...`, 'info');
            document.getElementById('topicPanel').style.display = 'none';

            const prompt = `You are an expert study planner.
Generate exactly 8 study topics for the subject "${subject}".
Difficulty: ${difficulty}
For every topic estimate the required study time.
Return ONLY valid JSON.
Example:
[{"topic":"Introduction","minutes":30},{"topic":"Loops","minutes":60}]
Rules:
Easy -> 20 to 45 mins
Medium -> 45 to 90 mins
Hard -> 90 to 180 mins
Only JSON.`;

            try {
                // Feature 'topics' with server-controlled model & tokens (V1-AI-01, V1-AI-05)
                const data = await window.eduskillGroqFetch({
                    feature: 'topics',
                    messages: [
                        { role: 'system', content: 'Return only JSON.' },
                        { role: 'user', content: prompt }
                    ],
                    temperature: 0.6
                });

                const raw = data.choices?.[0]?.message?.content || '';
                const parsed = (window.EduAI && typeof window.EduAI.parseAiJson === 'function')
                    ? window.EduAI.parseAiJson(raw, Array.isArray)
                    : null;

                const topicsArr = Array.isArray(parsed) ? parsed : (function () {
                    const m = raw.match(/\[[\s\S]*\]/);
                    try { return m ? JSON.parse(m[0]) : null; } catch (_) { return null; }
                })();

                if (!Array.isArray(topicsArr) || topicsArr.length === 0) {
                    throw new Error('AI did not return any topics. Please try again.');
                }

                generatedTopics = topicsArr.map(item => {
                    const topicStr = (item && typeof item.topic === 'string') ? item.topic.trim().slice(0, 60) : '';
                    const rawMins = Number(item && item.minutes);
                    const validMins = (Number.isFinite(rawMins) && rawMins > 0) ? Math.min(Math.max(Math.round(rawMins), 5), 240) : 30;
                    return {
                        topic: topicStr || 'Untitled Topic',
                        minutes: validMins
                    };
                }).filter(t => t.topic.length > 0);

                if (generatedTopics.length === 0) {
                    throw new Error('No valid topics found in AI response.');
                }

                document.getElementById('topicList').innerHTML =
                    generatedTopics.map((item, index) => `
                        <label class="topic-option">
                            <input type="checkbox" checked data-topic="${index}">
                            <div>
                                <b>${escapeHTML(item.topic)}</b><br>
                                <small>⏱ ${escapeHTML(String(item.minutes))} mins</small>
                            </div>
                        </label>
                    `).join('');

                document.getElementById('topicPanel').style.display = 'block';
                clearStatus('topicStatus');
                clearStatus('addSubjectStatus');

            } catch (err) {
                console.error(err);
                setStatus('topicStatus', err.message || 'AI topic generation failed. Please try again.', 'error');
            } finally {
                button.disabled = false;
                button.textContent = 'Generate AI Topics';
            }
        }

        function addSubject() {
            const rawName = document.getElementById('subjectName').value;
            const name = (rawName || '').trim();
            const difficulty = document.getElementById('difficulty').value;

            if (!name) {
                setStatus('addSubjectStatus', 'Subject name is required.', 'error');
                return;
            }
            if (name.length > 40) {
                setStatus('addSubjectStatus', 'Subject name must be at most 40 characters.', 'error');
                return;
            }
            if (!difficulty) {
                setStatus('addSubjectStatus', 'Please select a difficulty level.', 'error');
                return;
            }

            // Case-insensitive duplicate check (V1-FUNC-05)
            const currentSubjects = getSubjects();
            const lower = name.toLowerCase();
            if (currentSubjects.some(s => (s.name || '').trim().toLowerCase() === lower)) {
                setStatus('addSubjectStatus', `You already have a subject named "${name}".`, 'error');
                return;
            }

            const selected = [...document.querySelectorAll('#topicList input:checked')]
                .map(input => generatedTopics[Number(input.dataset.topic)])
                .filter(Boolean);

            if (!selected.length) {
                setStatus('addSubjectStatus', 'Please select at least one topic.', 'error');
                return;
            }

            const sid = 'sub_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
            const totalMinutes = selected.reduce((sum, item) => sum + Number(item.minutes), 0);

            // Structure topics with stable IDs and sid link (V1-DATA-09, V1-FUNC-01)
            const topicsWithIds = selected.map((item, idx) => ({
                id: 'top_' + Math.random().toString(36).slice(2, 9) + (Date.now() + idx).toString(36).slice(-4),
                sid: sid,
                name: item.topic.slice(0, 60),
                topic: item.topic.slice(0, 60),
                minutes: item.minutes,
                done: false
            }));

            const newSubject = {
                id: sid,
                name: name,
                difficulty: difficulty,
                topics: topicsWithIds,
                totalMinutes: totalMinutes
            };

            currentSubjects.push(newSubject);
            saveSubjects(currentSubjects);

            document.getElementById('subjectName').value = '';
            document.getElementById('difficulty').value = '';
            document.getElementById('topicPanel').style.display = 'none';
            document.getElementById('topicList').textContent = '';
            generatedTopics = [];

            updateSubjectSelect();
            renderSubjects();

            setStatus('topicStatus', `✅ Subject "${name}" added successfully!`, 'success');
            setTimeout(() => clearStatus('topicStatus'), 3000);
            notifyDataChange();
        }

        async function addExam() {
            const rawName = document.getElementById('examName').value;
            const name = (rawName || '').trim();
            const subject = document.getElementById('examSubjectSelect').value;
            const date = document.getElementById('examDate').value;

            if (!name) { setStatus('examStatus', 'Please enter an exam name.', 'error'); return; }
            if (name.length > 40) { setStatus('examStatus', 'Exam name must be at most 40 characters.', 'error'); return; }
            if (!subject) { setStatus('examStatus', 'Please select a subject.', 'error'); return; }
            if (!date) { setStatus('examStatus', 'Please pick an exam date.', 'error'); return; }

            const examTime = new Date(date + 'T00:00:00');
            if (isNaN(examTime.getTime())) {
                setStatus('examStatus', 'Please pick a valid calendar date.', 'error');
                return;
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const isPast = examTime < today;
            if (isPast) {
                const confirmed = window.EduUI && typeof EduUI.confirmDialog === 'function'
                    ? await EduUI.confirmDialog({
                        title: 'Past Exam Date',
                        body: `The date "${date}" is in the past. Do you want to save this as a past exam record?`,
                        confirmText: 'Save Past Exam',
                        cancelText: 'Cancel'
                    })
                    : confirm(`The date "${date}" is in the past. Do you want to save this as a past exam record?`);
                if (!confirmed) {
                    return;
                }
            }

            const currentExams = getExams();
            const currentSubs = getSubjects();
            const matchedSub = currentSubs.find(s => s.name === subject);
            const eid = 'exm_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

            const newExam = {
                id: eid,
                eid: eid,
                sid: matchedSub ? matchedSub.id : null,
                name: name,
                subject: subject,
                date: date,
                historical: isPast
            };
            currentExams.push(newExam);
            saveExams(currentExams);

            document.getElementById('examName').value = '';
            document.getElementById('examSubjectSelect').value = '';
            document.getElementById('examDate').value = '';

            renderExams();
            setStatus('examStatus', `✅ Exam "${name}" saved for ${date}!`, 'success');
            setTimeout(() => clearStatus('examStatus'), 3500);

            notifyDataChange();
        }

        // ── EDIT SUBJECT & EXAM (V1-FUNC-06) ──────────────────────────────────
        function editSubject(subjectId) {
            const currentSubs = getSubjects();
            const sub = currentSubs.find(s => String(s.id) === String(subjectId));
            if (!sub) return;

            const overlay = document.getElementById('editModalOverlay');
            const title = document.getElementById('editModalTitle');
            const fields = document.getElementById('editModalFields');
            const errEl = document.getElementById('editModalError');
            const saveBtn = document.getElementById('editModalSaveBtn');

            title.textContent = `Edit Subject: ${sub.name}`;
            errEl.style.display = 'none';

            fields.innerHTML = `
                <div>
                    <label style="font-size:12px; font-weight:600; color:var(--text-sub); display:block; margin-bottom:4px;">Subject Name</label>
                    <input type="text" id="editSubjectName" value="${escapeHTML(sub.name)}" maxlength="40" style="width:100%; box-sizing:border-box;">
                </div>
                <div>
                    <label style="font-size:12px; font-weight:600; color:var(--text-sub); display:block; margin-bottom:4px;">Difficulty</label>
                    <select id="editSubjectDiff" style="width:100%; box-sizing:border-box;">
                        <option value="Easy" ${sub.difficulty === 'Easy' ? 'selected' : ''}>Easy</option>
                        <option value="Medium" ${sub.difficulty === 'Medium' ? 'selected' : ''}>Medium</option>
                        <option value="Hard" ${sub.difficulty === 'Hard' ? 'selected' : ''}>Hard</option>
                    </select>
                </div>
            `;

            saveBtn.onclick = function () {
                const newName = (document.getElementById('editSubjectName').value || '').trim();
                const newDiff = document.getElementById('editSubjectDiff').value;

                if (!newName) {
                    errEl.textContent = 'Subject name is required.';
                    errEl.style.display = 'block';
                    return;
                }
                if (newName.length > 40) {
                    errEl.textContent = 'Subject name must be at most 40 characters.';
                    errEl.style.display = 'block';
                    return;
                }
                const lower = newName.toLowerCase();
                const dup = currentSubs.some(s => String(s.id) !== String(subjectId) && (s.name || '').trim().toLowerCase() === lower);
                if (dup) {
                    errEl.textContent = `You already have another subject named "${newName}".`;
                    errEl.style.display = 'block';
                    return;
                }

                const oldName = sub.name;
                sub.name = newName;
                sub.difficulty = newDiff;
                saveSubjects(currentSubs);

                if (oldName !== newName) {
                    const currentExams = getExams();
                    let examsChanged = false;
                    currentExams.forEach(e => {
                        if (String(e.sid || '') === String(subjectId) || e.subject === oldName) {
                            e.subject = newName;
                            e.sid = sub.id;
                            examsChanged = true;
                        }
                    });
                    if (examsChanged) saveExams(currentExams);
                }

                closeEditModal();
                updateSubjectSelect();
                renderSubjects();
                renderExams();
                notifyDataChange();
            };

            overlay.style.display = 'flex';
        }

        function editExam(examId) {
            const currentExams = getExams();
            const currentSubs = getSubjects();
            const exam = currentExams.find(e => String(e.id || e.eid) === String(examId));
            if (!exam) return;

            const overlay = document.getElementById('editModalOverlay');
            const title = document.getElementById('editModalTitle');
            const fields = document.getElementById('editModalFields');
            const errEl = document.getElementById('editModalError');
            const saveBtn = document.getElementById('editModalSaveBtn');

            title.textContent = `Edit Exam: ${exam.name}`;
            errEl.style.display = 'none';

            const subOptions = currentSubs.map(s => `
                <option value="${escapeHTML(s.name)}" ${s.name === exam.subject ? 'selected' : ''}>${escapeHTML(s.name)}</option>
            `).join('');

            fields.innerHTML = `
                <div>
                    <label style="font-size:12px; font-weight:600; color:var(--text-sub); display:block; margin-bottom:4px;">Exam Name</label>
                    <input type="text" id="editExamName" value="${escapeHTML(exam.name)}" maxlength="40" style="width:100%; box-sizing:border-box;">
                </div>
                <div>
                    <label style="font-size:12px; font-weight:600; color:var(--text-sub); display:block; margin-bottom:4px;">Subject</label>
                    <select id="editExamSub" style="width:100%; box-sizing:border-box;">${subOptions}</select>
                </div>
                <div>
                    <label style="font-size:12px; font-weight:600; color:var(--text-sub); display:block; margin-bottom:4px;">Date</label>
                    <input type="date" id="editExamDate" value="${escapeHTML(exam.date)}" style="width:100%; box-sizing:border-box;">
                </div>
            `;

            saveBtn.onclick = function () {
                const newName = (document.getElementById('editExamName').value || '').trim();
                const newSub = document.getElementById('editExamSub').value;
                const newDate = document.getElementById('editExamDate').value;

                if (!newName) {
                    errEl.textContent = 'Exam name is required.';
                    errEl.style.display = 'block';
                    return;
                }
                if (!newSub) {
                    errEl.textContent = 'Please select a subject.';
                    errEl.style.display = 'block';
                    return;
                }
                if (!newDate) {
                    errEl.textContent = 'Please pick an exam date.';
                    errEl.style.display = 'block';
                    return;
                }

                const examTime = new Date(newDate + 'T00:00:00');
                if (isNaN(examTime.getTime())) {
                    errEl.textContent = 'Please select a valid calendar date.';
                    errEl.style.display = 'block';
                    return;
                }

                const today = new Date();
                today.setHours(0, 0, 0, 0);
                exam.name = newName;
                exam.subject = newSub;
                exam.date = newDate;
                exam.historical = examTime < today;

                const matchedSub = currentSubs.find(s => s.name === newSub);
                if (matchedSub) exam.sid = matchedSub.id;

                saveExams(currentExams);
                closeEditModal();
                renderExams();
                notifyDataChange();
            };

            overlay.style.display = 'flex';
        }

        function closeEditModal() {
            const overlay = document.getElementById('editModalOverlay');
            if (overlay) overlay.style.display = 'none';
        }

        // ── CASCADE DELETE BY SID (V1-FUNC-04) ──────────────────────────────
        // ── CASCADE DELETE BY SID (V1-FUNC-04) ──────────────────────────────
        async function deleteSubject(id) {
            const currentSubs = getSubjects();
            const subject = currentSubs.find(s => String(s.id) === String(id));
            if (!subject) return;

            const currentExams = getExams();
            const matchingExams = currentExams.filter(e => String(e.sid || '') === String(id) || e.subject === subject.name);

            const quizHistory = (window.EduStorage && window.EduStorage.readJSON)
                ? window.EduStorage.readJSON('quizHistory', [])
                : [];
            const matchingQuiz = Array.isArray(quizHistory) ? quizHistory.filter(q => String(q.sid || '') === String(id) || q.subject === subject.name) : [];

            let matchingTasksCount = 0;
            const taskKeys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && (k.startsWith('tasks_') || k.includes('__tasks_'))) taskKeys.push(k);
            }
            taskKeys.forEach(k => {
                const arr = (window.EduStorage && window.EduStorage.readJSON)
                    ? window.EduStorage.readJSON(k, [])
                    : [];
                if (Array.isArray(arr)) {
                    matchingTasksCount += arr.filter(t => t && t.ref && String(t.ref.sid) === String(id)).length;
                }
            });

            const msg = `Are you sure you want to delete "${subject.name}"?\nThis will remove ${matchingExams.length} exam(s), ${matchingTasksCount} linked task(s), and ${matchingQuiz.length} quiz record(s).`;
            const confirmed = window.EduUI && typeof EduUI.confirmDialog === 'function'
                ? await EduUI.confirmDialog({
                    title: 'Delete Subject',
                    body: msg,
                    confirmText: 'Delete Subject',
                    cancelText: 'Cancel',
                    danger: true
                })
                : confirm(msg);
            if (!confirmed) return;

            const newSubs = currentSubs.filter(s => String(s.id) !== String(id));
            saveSubjects(newSubs);

            if (matchingExams.length) {
                const newExams = currentExams.filter(e => String(e.sid || '') !== String(id) && e.subject !== subject.name);
                saveExams(newExams);
            }

            if (matchingQuiz.length) {
                const newQuiz = quizHistory.filter(q => String(q.sid || '') !== String(id) && q.subject !== subject.name);
                if (window.EduStorage) window.EduStorage.writeJSON('quizHistory', newQuiz);
                else localStorage.setItem('quizHistory', JSON.stringify(newQuiz));
            }

            taskKeys.forEach(k => {
                const arr = (window.EduStorage && window.EduStorage.readJSON)
                    ? window.EduStorage.readJSON(k, [])
                    : [];
                if (Array.isArray(arr)) {
                    const cleaned = arr.filter(t => !t || !t.ref || String(t.ref.sid) !== String(id));
                    if (cleaned.length !== arr.length) {
                        if (window.EduStorage && window.EduStorage.writeJSON) {
                            window.EduStorage.writeJSON(k, cleaned);
                        } else {
                            localStorage.setItem(k, JSON.stringify(cleaned));
                        }
                    }
                }
            });

            updateSubjectSelect();
            renderSubjects();
            renderExams();
            notifyDataChange();
        }

        async function deleteExam(id) {
            const currentExams = getExams();
            const exam = currentExams.find(e => String(e.id || e.eid) === String(id));
            if (exam) {
                const confirmed = window.EduUI && typeof EduUI.confirmDialog === 'function'
                    ? await EduUI.confirmDialog({
                        title: 'Delete Exam',
                        body: `Are you sure you want to delete exam "${exam.name}"?`,
                        confirmText: 'Delete Exam',
                        cancelText: 'Cancel',
                        danger: true
                    })
                    : confirm(`Are you sure you want to delete exam "${exam.name}"?`);
                if (!confirmed) return;
            }

            const newExams = currentExams.filter(e => String(e.id || e.eid) !== String(id));
            saveExams(newExams);
            renderExams();
            notifyDataChange();
        }

        function renderSubjects() {
            const subjects = getSubjects();
            const box = document.getElementById("subjects");

            if (!subjects.length) {
                box.innerHTML = '<p class="empty-msg">No subjects added yet. Use the form above to get started!</p>';
                return;
            }

            box.innerHTML = subjects.map(subject => {
                const total = subject.totalMinutes || 0;
                const hrs = Math.floor(total / 60);
                const mins = total % 60;
                const totalText = hrs > 0 ? `${hrs} hr ${mins} mins` : `${mins} mins`;

                const topics = Array.isArray(subject.topics) ? subject.topics : [];
                const doneTopics = topics.filter(t => t && t.done).length;
                const pct = topics.length > 0 ? Math.round((doneTopics / topics.length) * 100) : 0;

                return `
                <article class="subject-card">
                    <div>
                        <h3 style="font-size:16px;">📚 ${escapeHTML(subject.name)}</h3>
                        <span class="difficulty-badge ${escapeHTML(subject.difficulty || 'Medium')}">${escapeHTML(subject.difficulty || 'Medium')}</span>

                        <p style="margin-top:10px; font-weight:bold; color:#4f46e5;">
                            ⏱ Total Study Time : ${totalText}
                        </p>

                        <div style="margin-top:10px;">
                            <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-sub); margin-bottom:4px;">
                                <span>Progress</span>
                                <span>${doneTopics}/${topics.length} topics · ${pct}%</span>
                            </div>
                            <div style="height:8px; background:#f1f5f9; border-radius:10px; overflow:hidden;">
                                <div style="height:100%; width:${pct}%; background:#4f46e5; border-radius:10px; transition:width 0.4s ease;"></div>
                            </div>
                        </div>

                        <div class="topic-tags">
                            ${topics.map((item, idx) => `
                                <div class="topic-item ${item.done ? 'done' : ''}" style="
                                    width:100%;
                                    padding:8px;
                                    margin-top:6px;
                                    background:#eef2ff;
                                    border-radius:8px;
                                    font-size:12px;
                                    display:flex;
                                    align-items:center;
                                    gap:8px;
                                ">
                                    <input 
                                        type="checkbox" 
                                        ${item.done ? 'checked' : ''} 
                                        disabled
                                        title="Complete this topic by passing its quiz in the Quiz tab"
                                        style="cursor:not-allowed; width:15px; height:15px; accent-color:#4f46e5;"
                                    >
                                    <div style="flex:1;">
                                        <b style="${item.done ? 'text-decoration: line-through; color: var(--text-sub);' : ''}">${escapeHTML(item.name || item.topic)}</b>
                                        <br>
                                        <small style="color:var(--text-sub);">⏱ ${escapeHTML(String(Number(item.minutes) || 30))} mins</small>
                                    </div>
                                </div>
                            `).join("")}
                        </div>
                    </div>

                    <div class="card-actions">
                        <button class="btn-edit" type="button" onclick="editSubject('${escapeHTML(subject.id)}')">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="btn-delete" type="button" onclick="deleteSubject('${escapeHTML(subject.id)}')">
                            <i class="fas fa-trash-alt"></i> Delete
                        </button>
                    </div>
                </article>
                `;
            }).join("");
        }

        function renderExams() {
            const exams = getExams();
            const box = document.getElementById('exams');

            if (!exams.length) {
                box.innerHTML = '<p class="empty-msg">No upcoming exams. Add exam details above!</p>';
                return;
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            box.innerHTML = exams.map(e => {
                const examTime = new Date(e.date + 'T00:00:00');
                const isPast = e.historical || (!isNaN(examTime.getTime()) && examTime < today);
                return `
                <article class="exam-card">
                    <div>
                        <h3 style="font-size: 15px; font-weight: 600;">📝 ${escapeHTML(e.name)}${isPast ? ' <span style="font-size:10px;padding:2px 6px;background:#f1f5f9;color:var(--text-sub);border-radius:4px;font-weight:normal;">Past</span>' : ''}</h3>
                        <p style="font-size: 12px; color: var(--primary-blue); font-weight: 600; margin-top: 4px;">
                            ${escapeHTML(e.subject)}
                        </p>
                        <p style="font-size: 12px; color: var(--text-sub); margin-top: 6px;">
                            📅 ${escapeHTML(e.date)}
                        </p>
                    </div>

                    <div class="card-actions">
                        <button class="btn-edit" type="button" onclick="editExam('${escapeHTML(e.id || e.eid)}')">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="btn-delete" type="button" onclick="deleteExam('${escapeHTML(e.id || e.eid)}')">
                            <i class="fas fa-trash-alt"></i> Delete
                        </button>
                    </div>
                </article>
            `;}).join('');
        }

        function notifyDataChange() {
            if (window.parent && window.parent !== window) {
                if (typeof window.parent.renderTasks === 'function') window.parent.renderTasks();
                if (typeof window.parent.renderUpcomingExams === 'function') window.parent.renderUpcomingExams();
                if (typeof window.parent.updateNotificationBadge === 'function') window.parent.updateNotificationBadge();
                try { window.parent.postMessage({ type: 'data-changed' }, window.location.origin); } catch (e) {}
            }
        }

        // Normalize subjects without dropping records (FUNC-09)
        const initSubjects = getSubjects();
        let _subjectsModified = false;
        initSubjects.forEach((s, idx) => {
            if (!Array.isArray(s.topics)) { s.topics = []; _subjectsModified = true; }
            if (!s.id) { s.id = 'sub_' + Date.now() + '_' + idx; _subjectsModified = true; }
            s.topics.forEach((t, tIdx) => {
                if (!t.id) { t.id = 'top_' + s.id + '_' + tIdx; _subjectsModified = true; }
                if (!t.sid) { t.sid = s.id; _subjectsModified = true; }
            });
        });
        if (_subjectsModified) {
            saveSubjects(initSubjects);
        }

        // Initialize page elements on load
        updateSubjectSelect();
        renderSubjects();
        renderExams();

        // Listen for data sync updates (V1-FUNC-03)
        window.addEventListener('storage', (e) => {
            if (!e.key || e.key.includes('subjects') || e.key.includes('exams')) {
                updateSubjectSelect();
                renderSubjects();
                renderExams();
            }
        });
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'data-changed') {
                updateSubjectSelect();
                renderSubjects();
                renderExams();
            }
        });
    </script>
    <script>
        document.addEventListener('click', () => {
            if (window.parent && typeof window.parent.closeOverlays === 'function') {
                window.parent.closeOverlays();
            }
        });
    </script>
</body>

</html>
