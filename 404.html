<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | EDU-SKILL'S AI</title>
  <meta name="description" content="The requested page could not be found on EDU-SKILL'S AI.">
  <meta name="theme-color" content="#4338ca">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234338ca'><path d='M12 3L1 9l11 6 9-4.91V17h2V9L12 3z'/></svg>">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      text-align: center;
    }
    .error-card {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
    }
    .error-code {
      font-size: 64px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 12px;
    }
    .error-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
    }
    .error-desc {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 26px;
    }
  </style>
</head>
<body>
  <main class="error-card" role="main">
    <div class="error-code" aria-hidden="true">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The study page or resource you're looking for doesn't exist, was moved, or is temporarily unavailable.</p>
    <a href="index.html" class="btn btn-primary" style="padding: 11px 24px;">
      <span>Back to Dashboard</span>
    </a>
  </main>
</body>
</html>
